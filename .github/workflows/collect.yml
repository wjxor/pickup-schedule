name: 일정 수집

on:
  schedule:
    # cron은 UTC 기준이다. 한국시간으로는 06:00 / 12:00 / 18:00 / 24:00 에 실행된다.
    #
    # 첫 실행을 06:00(KST)로 잡은 이유: 게임 점검이 보통 이 시각 전후에 끝나고
    # 새 버전·픽업이 그때 열린다. 점검 직후에 한 번 받아두면 당일 시작하는 일정을
    # 놓치지 않는다.
    #
    # 하루 4번인 이유: 호요버스 공지 API는 진행 중인 공지만 주고 과거 이력이 없다.
    # 수집을 거른 사이에 시작해서 끝난 짧은 이벤트는 영영 남지 않는다.
    - cron: '0 3,9,15,21 * * *'

  # 수동 실행. 어댑터를 고친 뒤 바로 확인할 때 쓴다.
  workflow_dispatch:

# 앞선 실행이 아직 돌고 있으면 끝날 때까지 기다린다.
# upsert라 겹쳐도 데이터가 깨지지는 않지만, 같은 API를 동시에 두 번 때릴 이유가 없다.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: 공식 공지 수집 후 DB 저장
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # NODE_ENV를 production으로 두면 npm ci가 devDependencies를 건너뛰어
      # 수집 스크립트를 실행하는 tsx가 설치되지 않는다. 그래서 설정하지 않는다.
      - name: 의존성 설치
        run: npm ci

      - name: 일정 수집 및 저장
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 어디서 온 요청인지 밝히는 것이 크롤링 예절이다.
          COLLECTOR_USER_AGENT: 'PickupScheduleBot/0.1 (+https://github.com/wjxor/pickup-schedule)'
          LOG_LEVEL: info
        run: npm run collect:save
